# Build standalone `steampunk` binaries and publish a GitHub Release on version tags.
#
# Usage:
#   git tag v0.1.0
#   git push origin v0.1.0
#
# Assets: one archive per target (no Rust toolchain required to run the CLI).
# Note: `steampunk build` still needs a system C linker (cc/clang/gcc/MSVC) on the
# machine that compiles .stk → native binary; `run` / JIT does not.

name: Release

on:
  push:
    tags:
      - "v*"
  # Manual retry from the Actions tab (e.g. if a tag was pushed before the
  # commit landed on the default branch).
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build/publish (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # Keep release builds reproducible-ish and smaller.
  CARGO_INCREMENTAL: "0"
  # On tag push: github.ref_name is v0.1.0. On manual run: use the input.
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-musl
            archive: tar.gz
            binary: steampunk
          - os: ubuntu-22.04
            target: aarch64-unknown-linux-musl
            archive: tar.gz
            binary: steampunk
            use_cross: true
          - os: macos-13
            target: x86_64-apple-darwin
            archive: tar.gz
            binary: steampunk
          - os: macos-14
            target: aarch64-apple-darwin
            archive: tar.gz
            binary: steampunk
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
            binary: steampunk.exe
            rustflags: -C target-feature=+crt-static

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools (Linux glibc-free)
        if: runner.os == 'Linux' && !matrix.use_cross
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install cross (Linux aarch64)
        if: matrix.use_cross
        run: cargo install cross --locked

      - name: Build release binary
        working-directory: compiler
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release -p stk-cli --target "${{ matrix.target }}"
          else
            cargo build --release -p stk-cli --target "${{ matrix.target }}"
          fi
        shell: bash

      - name: Package artifact
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG}"
          TARGET="${{ matrix.target }}"
          BIN_SRC="compiler/target/${TARGET}/release/${{ matrix.binary }}"
          STAGING="dist/steampunk-${VERSION}-${TARGET}"
          mkdir -p "${STAGING}"
          cp "${BIN_SRC}" "${STAGING}/"
          if command -v strip >/dev/null 2>&1 && [[ "${{ matrix.binary }}" != *.exe ]]; then
            strip "${STAGING}/${{ matrix.binary }}" || true
          fi
          cp LICENSE README.md SPEC.md "${STAGING}/" 2>/dev/null || true
          cd dist
          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a -tzip "steampunk-${VERSION}-${TARGET}.zip" "steampunk-${VERSION}-${TARGET}"
            echo "ASSET=dist/steampunk-${VERSION}-${TARGET}.zip" >> "$GITHUB_ENV"
          else
            tar -czf "steampunk-${VERSION}-${TARGET}.tar.gz" "steampunk-${VERSION}-${TARGET}"
            echo "ASSET=dist/steampunk-${VERSION}-${TARGET}.tar.gz" >> "$GITHUB_ENV"
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: steampunk-${{ matrix.target }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect assets + checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec cp {} release-assets/ \;
          cd release-assets
          sha256sum * > SHA256SUMS.txt
          ls -la

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Steampunk ${{ env.RELEASE_TAG }}
          draft: false
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
          generate_release_notes: true
          body: |
            ## Binários standalone

            Baixe o arquivo da sua plataforma, extraia e coloque `steampunk` (ou `steampunk.exe`) no `PATH`.
            **Não é necessário instalar Rust** para usar a CLI.

            | Plataforma | Artefato |
            |------------|----------|
            | Linux x86_64 (estático / musl) | `steampunk-*-x86_64-unknown-linux-musl.tar.gz` |
            | Linux aarch64 (estático / musl) | `steampunk-*-aarch64-unknown-linux-musl.tar.gz` |
            | macOS Intel | `steampunk-*-x86_64-apple-darwin.tar.gz` |
            | macOS Apple Silicon | `steampunk-*-aarch64-apple-darwin.tar.gz` |
            | Windows x86_64 | `steampunk-*-x86_64-pc-windows-msvc.zip` |

            Verifique a integridade com `SHA256SUMS.txt`.

            ### Observação

            - `steampunk run` / JIT: sem dependências extras.
            - `steampunk build` (AOT): ainda precisa de um linker C no sistema (`cc`/`clang`/`gcc` no Unix; MSVC Build Tools no Windows) para linkar o objeto gerado.
          files: |
            release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
